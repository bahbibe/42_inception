x-DRY: &DRY
  restart: unless-stopped
  init: true
  networks:
    - inception
  env_file: ./.env
services:
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./requirements/nginx
      args:
        - CERT_PATH=${CERT_PATH}
        - KEY_PATH=${KEY_PATH}
        - WP_URL=${WP_URL}
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html/wordpress
    <<: *DRY
  wordpress:
    container_name: wordpress
    image: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress:/var/www/html/wordpress
    secrets:
      - db_password
      - credentials
    <<: *DRY
  mariadb:
    container_name: mariadb
    image: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    <<: *DRY
  redis:
    container_name: redis
    image: redis
    build: ./requirements/bonus/redis
    <<: *DRY
  ftp:
    container_name: ftp
    image: ftp
    build: ./requirements/bonus/ftp
    secrets:
      - credentials
    ports:
      - "20-21:20-21"
      - "4000-4010:4000-4010"
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html/wordpress
    <<: *DRY
  website:
      container_name: website
      image: website
      build: ./requirements/bonus/website
      ports:
        - "1337:1337"
      <<: *DRY
  adminer:
    container_name: adminer
    image: adminer
    build: ./requirements/bonus/adminer
    ports:
      - 4242:4242
    depends_on:
      - mariadb
    <<: *DRY
  mailpit:
    container_name: mailpit
    image: mailpit
    build: ./requirements/bonus/mailpit
    ports:
      - 8025:8025
    volumes:
      - mailpit:/data
    <<: *DRY
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
networks:
  inception:
    name: inception
volumes:
  mailpit:
    name: mailpit
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      device: /home/${LOGIN}/data/wordpress
      o: bind
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      device: /home/${LOGIN}/data/mariadb
      o: bind

